<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moda Sofía · Dashboard de Ventas</title>
  <style>
    /* ===== Variables de color y diseño ===== */
    :root {
      --bg: #0f1117;
      --surface: #181b24;
      --surface-2: #20242f;
      --border: #2a2f3c;
      --text: #e8eaf0;
      --text-muted: #8b91a1;
      --accent: #c084fc;        /* violeta principal de la marca */
      --accent-2: #f472b6;      /* rosa secundario */
      --success: #34d399;
      --danger: #f87171;
      --tarjeta-bg: #0f1f3d;      /* azul marino de las tarjetas */
      --tarjeta-borde: #1e3461;
      --tarjeta-icono: #19305a;
      --radius: 14px;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    /* ===== Reset básico ===== */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      line-height: 1.5;
      min-height: 100vh;
    }

    .contenedor {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 20px 48px;
    }

    /* ===== Animación de entrada (fade-in hacia arriba) ===== */
    @keyframes aparecer {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .animado {
      opacity: 0;
      animation: aparecer 0.6s ease-out forwards;
      animation-delay: var(--retraso, 0s);
    }

    /* Respeta a quienes prefieren menos movimiento */
    @media (prefers-reduced-motion: reduce) {
      .animado { animation: none; opacity: 1; }
      .barra { transition: none !important; }
    }

    /* ===== Encabezado ===== */
    .encabezado {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 32px;
    }

    .marca {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 22px;
      color: #1a1022;
    }

    .marca h1 { font-size: 1.6rem; font-weight: 700; }
    .marca p  { color: var(--text-muted); font-size: 0.9rem; }

    .fecha {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 999px;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    /* ===== Tarjetas de métricas ===== */
    .metricas {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 28px;
    }

    .tarjeta {
      background: var(--tarjeta-bg);
      border: 1px solid var(--tarjeta-borde);
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: var(--shadow);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .tarjeta:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
    }

    .tarjeta-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .tarjeta-titulo {
      color: var(--text-muted);
      font-size: 0.88rem;
      font-weight: 500;
    }

    .icono {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: var(--tarjeta-icono);
      display: grid;
      place-items: center;
      font-size: 18px;
    }

    .tarjeta-valor {
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      font-variant-numeric: tabular-nums;
    }

    .variacion {
      margin-top: 6px;
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .variacion .sube  { color: var(--success); font-weight: 600; }
    .variacion .baja  { color: var(--danger);  font-weight: 600; }

    /* ===== Paneles (gráfico y tabla) ===== */
    .paneles {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      min-width: 0; /* evita desbordes en grid */
    }

    .panel h2 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .panel .subtitulo {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-bottom: 22px;
    }

    /* ===== Gráfico de barras (hecho con CSS) ===== */
    .grafico {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 14px;
      height: 260px;
      padding-top: 24px;
      border-bottom: 1px solid var(--border);
      position: relative;
    }

    /* Líneas guía horizontales de fondo */
    .grafico::before {
      content: "";
      position: absolute;
      inset: 24px 0 0 0;
      background-image: linear-gradient(to bottom, var(--border) 1px, transparent 1px);
      background-size: 100% 25%;
      opacity: 0.5;
      pointer-events: none;
    }

    .columna {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      position: relative;
      z-index: 1;
    }

    .barra {
      width: 100%;
      max-width: 52px;
      height: 0; /* crece con JavaScript */
      border-radius: 8px 8px 0 0;
      background: linear-gradient(to top, var(--accent), var(--accent-2));
      opacity: 0.75;
      transition: height 1s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s ease;
      position: relative;
      cursor: pointer;
    }

    /* El mes actual se resalta */
    .barra.actual { opacity: 1; }
    .barra:hover  { opacity: 1; }

    /* Valor que aparece sobre la barra */
    .barra-valor {
      position: absolute;
      top: -24px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.75rem;
      color: var(--text-muted);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .barra:hover .barra-valor,
    .barra.actual .barra-valor { color: var(--text); font-weight: 600; }

    .etiquetas {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      margin-top: 10px;
    }

    .etiquetas span {
      flex: 1;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.82rem;
    }

    /* ===== Tabla de ventas ===== */
    .tabla-envoltura { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    th {
      text-align: left;
      color: var(--text-muted);
      font-weight: 500;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 0 12px 12px;
      border-bottom: 1px solid var(--border);
    }

    td {
      padding: 14px 12px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    tbody tr:last-child td { border-bottom: none; }
    tbody tr { transition: background 0.15s ease; }
    tbody tr:hover { background: var(--surface-2); }

    .monto {
      text-align: right;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    th.monto { font-weight: 500; }

    .cliente {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--accent);
    }

    .fecha-celda { color: var(--text-muted); }

    /* ===== Diseño responsivo ===== */
    @media (max-width: 900px) {
      .paneles { grid-template-columns: 1fr; }
    }

    @media (max-width: 520px) {
      .contenedor { padding: 20px 16px 32px; }
      .marca h1 { font-size: 1.3rem; }
      .grafico, .etiquetas { gap: 8px; }
      .barra-valor { font-size: 0.65rem; }
    }
  </style>
</head>
<body>
  <div class="contenedor">

    <!-- Encabezado con logo y fecha -->
    <header class="encabezado animado" style="--retraso: 0s">
      <div class="marca">
        <div class="logo">S</div>
        <div>
          <h1>Moda Sofía</h1>
          <p>Panel de ventas</p>
        </div>
      </div>
      <div class="fecha" id="fecha-hoy"></div>
    </header>

    <!-- Tarjetas de métricas (se generan con JavaScript) -->
    <section class="metricas" id="metricas"></section>

    <!-- Gráfico y tabla -->
    <section class="paneles">
      <article class="panel animado" style="--retraso: 0.5s">
        <h2>Ventas de los últimos 6 meses</h2>
        <p class="subtitulo">Ingresos mensuales en dólares</p>
        <div class="grafico" id="grafico"></div>
        <div class="etiquetas" id="etiquetas"></div>
      </article>

      <article class="panel animado" style="--retraso: 0.6s">
        <h2>Últimas ventas</h2>
        <p class="subtitulo">Las 5 transacciones más recientes</p>
        <div class="tabla-envoltura">
          <table>
            <thead>
              <tr>
                <th>Fecha</th>
                <th>Producto</th>
                <th>Cliente</th>
                <th class="monto">Monto</th>
              </tr>
            </thead>
            <tbody id="tabla-ventas"></tbody>
          </table>
        </div>
      </article>
    </section>
  </div>

  <script>
    // ===== Datos ficticios de ejemplo =====

    // Métricas principales del mes
    const metricas = [
      { titulo: "Ventas del mes",      valor: 342,    formato: "numero", icono: "🛍️", cambio: 12.5 },
      { titulo: "Clientes nuevos",     valor: 87,     formato: "numero", icono: "👤", cambio: 8.2 },
      { titulo: "Productos vendidos",  valor: 1128,   formato: "numero", icono: "👗", cambio: -3.1 },
      { titulo: "Ingresos totales",    valor: 48650,  formato: "dinero", icono: "💰", cambio: 15.4 }
    ];

    // Ventas mensuales (últimos 6 meses)
    const ventasMensuales = [
      { mes: "Jun", monto: 31200 },
      { mes: "Jul", monto: 35800 },
      { mes: "Ago", monto: 29400 },
      { mes: "Sep", monto: 38900 },
      { mes: "Oct", monto: 42150 },
      { mes: "Nov", monto: 48650 }
    ];

    // Últimas 5 ventas
    const ultimasVentas = [
      { fecha: "2026-11-16", producto: "Vestido floral de verano", cliente: "Lucía Fernández", monto: 89.90 },
      { fecha: "2026-11-15", producto: "Chaqueta de jean",          cliente: "Martín Gómez",    monto: 124.50 },
      { fecha: "2026-11-15", producto: "Blusa de seda",             cliente: "Valentina Ruiz",  monto: 65.00 },
      { fecha: "2026-11-14", producto: "Pantalón palazzo",          cliente: "Camila Torres",   monto: 72.30 },
      { fecha: "2026-11-13", producto: "Bufanda de lana",           cliente: "Diego Morales",   monto: 34.99 }
    ];

    // ===== Utilidades de formato =====
    const formatoDinero = new Intl.NumberFormat("es-ES", { style: "currency", currency: "USD", maximumFractionDigits: 0 });
    const formatoDineroDecimal = new Intl.NumberFormat("es-ES", { style: "currency", currency: "USD" });
    const formatoNumero = new Intl.NumberFormat("es-ES");

    function formatear(valor, formato) {
      return formato === "dinero" ? formatoDinero.format(valor) : formatoNumero.format(valor);
    }

    // Obtiene las iniciales de un nombre ("Lucía Fernández" -> "LF")
    function iniciales(nombre) {
      return nombre.split(" ").map(p => p[0]).join("").slice(0, 2).toUpperCase();
    }

    // Formatea fecha ISO a "16 nov"
    function fechaCorta(iso) {
      const [a, m, d] = iso.split("-").map(Number);
      return new Date(a, m - 1, d).toLocaleDateString("es-ES", { day: "numeric", month: "short" });
    }

    // ===== Fecha actual en el encabezado =====
    document.getElementById("fecha-hoy").textContent =
      new Date().toLocaleDateString("es-ES", { weekday: "long", day: "numeric", month: "long", year: "numeric" });

    // ===== Renderizar tarjetas de métricas =====
    const contenedorMetricas = document.getElementById("metricas");

    metricas.forEach((m, i) => {
      const sube = m.cambio >= 0;
      const tarjeta = document.createElement("div");
      tarjeta.className = "tarjeta animado";
      tarjeta.style.setProperty("--retraso", `${0.1 + i * 0.1}s`);
      tarjeta.innerHTML = `
        <div class="tarjeta-top">
          <span class="tarjeta-titulo">${m.titulo}</span>
          <span class="icono">${m.icono}</span>
        </div>
        <div class="tarjeta-valor" data-valor="${m.valor}" data-formato="${m.formato}">0</div>
        <div class="variacion">
          <span class="${sube ? "sube" : "baja"}">${sube ? "▲" : "▼"} ${Math.abs(m.cambio)}%</span>
          vs. mes anterior
        </div>`;
      contenedorMetricas.appendChild(tarjeta);
    });

    // Animación de conteo: los números suben desde 0 hasta su valor
    function animarContador(elemento, duracion = 1200) {
      const final = Number(elemento.dataset.valor);
      const formato = elemento.dataset.formato;
      const inicio = performance.now();

      function paso(ahora) {
        const progreso = Math.min((ahora - inicio) / duracion, 1);
        const suavizado = 1 - Math.pow(1 - progreso, 3); // easing de salida
        elemento.textContent = formatear(Math.round(final * suavizado), formato);
        if (progreso < 1) requestAnimationFrame(paso);
      }
      requestAnimationFrame(paso);
    }

    // ===== Renderizar gráfico de barras =====
    const grafico = document.getElementById("grafico");
    const etiquetas = document.getElementById("etiquetas");
    const maximo = Math.max(...ventasMensuales.map(v => v.monto));

    ventasMensuales.forEach((v, i) => {
      const esActual = i === ventasMensuales.length - 1;

      const columna = document.createElement("div");
      columna.className = "columna";
      columna.innerHTML = `
        <div class="barra ${esActual ? "actual" : ""}" data-altura="${(v.monto / maximo) * 100}"
             title="${v.mes}: ${formatoDinero.format(v.monto)}">
          <span class="barra-valor">${(v.monto / 1000).toFixed(1)}k</span>
        </div>`;
      grafico.appendChild(columna);

      const etiqueta = document.createElement("span");
      etiqueta.textContent = v.mes;
      etiquetas.appendChild(etiqueta);
    });

    // ===== Renderizar tabla de últimas ventas =====
    const tabla = document.getElementById("tabla-ventas");

    ultimasVentas.forEach(venta => {
      const fila = document.createElement("tr");
      fila.innerHTML = `
        <td class="fecha-celda">${fechaCorta(venta.fecha)}</td>
        <td>${venta.producto}</td>
        <td>
          <div class="cliente">
            <span class="avatar">${iniciales(venta.cliente)}</span>
            ${venta.cliente}
          </div>
        </td>
        <td class="monto">${formatoDineroDecimal.format(venta.monto)}</td>`;
      tabla.appendChild(fila);
    });

    // ===== Iniciar animaciones al cargar la página =====
    window.addEventListener("load", () => {
      // Contadores de las tarjetas
      document.querySelectorAll(".tarjeta-valor").forEach(animarContador);

      // Las barras crecen con un pequeño escalonado
      setTimeout(() => {
        document.querySelectorAll(".barra").forEach((barra, i) => {
          setTimeout(() => { barra.style.height = barra.dataset.altura + "%"; }, i * 90);
        });
      }, 600);
    });
  </script>
</body>
</html>
